<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Sign in — Bei Sahihi</title>
 <link rel="stylesheet" href="css/style.css">
</head>
<body>
 <div class="auth-layout">
   <div class="auth-art">
     <span class="blob blob-pink" style="width:210px;height:210px;top:30px;left:40px;"></span>
     <span class="blob blob-cyan" style="width:140px;height:140px;bottom:60px;right:30px;"></span>
     <a class="brand" href="index.html">
       <span class="brand-mark"></span>
       <span data-i18n="brand">Bei Sahihi</span>
     </a>
     <h1 data-i18n="welcome">Welcome</h1>
     <p style="margin-top:12px;">Kariakoo · Mwenge · Temeke</p>
   </div>
   <div class="auth-form-side">
     <form class="panel" onsubmit="handleSignin(event)">
       <h2 data-i18n="signin">Sign in</h2>
       <p class="muted">Use the email you registered with.</p>
       <div id="errorBox" class="error"></div>
       <label data-i18n="email">Email</label>
       <input id="email" type="email" required>
       <label data-i18n="password">Password</label>
       <input id="password" type="password" required>
       <div class="form-actions">
         <button class="btn btn-pink" type="submit" data-i18n="signin">Sign in</button>
         <button class="btn btn-ghost" type="button" onclick="toggleLang()" id="langLabel">SW</button>
       </div>
       <p style="margin-top:16px;"><a href="signup.html" data-i18n="noAccount">New here? Create an account</a></p>
     </form>
   </div>
 </div>
 <script src="js/storage.js"></script>
 <script src="js/lang.js"></script>
 <script src="js/auth.js"></script>
 <script>applyLang();</script>
</body>
</html>
